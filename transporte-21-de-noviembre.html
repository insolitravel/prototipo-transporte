function estadoRes(r){
  if(r.hecho)return &#x27;Viaje realizado &#x27;+r.fecha.toLowerCase();
  if(r.ant)return `📅 ${r.dia} a las ${r.hora} · prefieres ${r.pref.toLowerCase()}. Móvil por asignar: te avisamos cerca de la hora.`;
  if(!r.vid)return `Salida fija ${r.fija}: móvil por asignar. Te avisamos al asignarse.`;
  for(const k in T){const i=T[k].fila.indexOf(r.vid);if(i===0)return &#x27;En el carril: alístate, sale al llenarse&#x27;;if(i&gt;0)return `Turno ${i+1} en la fila`;
    const f=T[k].fijas.find(f=&gt;f.v===r.vid);if(f)return `Salida fija a las ${f.h}, asignado y confirmado`;}
  return &#x27;En viaje&#x27;;
}

      if(k===&#x27;recojo&#x27;)pintarUbic(); chk();});});

}

function pintarBus(){
  const v=V[bk.vid];let n=1,h=&#x27;&#x27;;
  const seat=()=&gt;{const k=n++;const c=v.occ.includes(k)?&#x27;o&#x27;:v.pend.includes(k)?&#x27;p&#x27;:bk.sel.includes(k)?&#x27;s&#x27;:&#x27;&#x27;;
    return `&lt;button class=&quot;seat ${c}&quot; ${c===&#x27;o&#x27;||c===&#x27;p&#x27;?&#x27;disabled&#x27;:&#x27;&#x27;} aria-label=&quot;Asiento ${k}${c===&#x27;o&#x27;?&#x27;, ocupado&#x27;:c===&#x27;p&#x27;?&#x27;, apartado&#x27;:c===&#x27;s&#x27;?&#x27;, elegido&#x27;:&#x27;, libre&#x27;}&quot; onclick=&quot;tocar(${k})&quot;&gt;${k}&lt;/button&gt;`;};

function tocar(k){const i=bk.sel.indexOf(k);if(i&gt;=0){bk.sel.splice(i,1);delete bk.nombres[k];}else bk.sel.push(k);
  bk.sel.sort((a,b)=&gt;a-b);pintarBus();pintarNombres();chk();}

function confirmar(){
  if(bk.pa){reservas.unshift({id:&#x27;r&#x27;+Date.now(),vid:null,fija:bk.fija,term:term,de:T[term].de,a:T[term].a,
      asientos:bk.sel.map(k=&gt;({n:null,nom:bk.nombres[k].trim()})),recojo:bk.recojo===&#x27;Casa&#x27;?&#x27;en tu ubicación&#x27;:&#x27;en la oficina&#x27;,equip:bk.equip,sube:bk.sube,baja:bk.baja,total:totalBk(),hecho:false});
    const h=bk.fija;cerrar();render();toast(`Reserva confirmada para las ${h}. Te avisamos qué móvil te toca.`);return;}
  const v=V[bk.vid];v.occ.push(...bk.sel);
  reservas.unshift({id:&#x27;r&#x27;+Date.now(),vid:bk.vid,de:T[term].de,a:T[term].a,asientos:bk.sel.map(k=&gt;({n:k,nom:bk.nombres[k].trim()})),
    recojo:bk.recojo===&#x27;Casa&#x27;?&#x27;en tu ubicación&#x27;:&#x27;en la oficina&#x27;,equip:bk.equip,sube:bk.sube,baja:bk.baja,total:totalBk(),hecho:false});
  pubPas(bk.vid,bk.sel.map(k=&gt;({n:k,nom:bk.nombres[k].trim()})),bk.equip,bk.recojo===&#x27;Casa&#x27;?&#x27;Casa&#x27;:&#x27;Oficina&#x27;,bk.sube,bk.baja);
  const m=v.movil;cerrar();render();
  const t=T[term];
  if(t.fila[0]&amp;&amp;V[t.fila[0]]===v&amp;&amp;libres(v)&lt;=0){

  }else toast(`Reserva confirmada en el móvil ${m}. Te avisamos cuando esté por llenarse.`);
}

function asignar(){
  const t=T[term]; const msg=[];
  t.fijas.forEach(f=&gt;{f.v=f.pv;const v=V[f.v];msg.push(`${f.h} móvil ${v.movil}`);
    reservas.filter(r=&gt;!r.vid&amp;&amp;r.fija===f.h&amp;&amp;r.term===term).forEach(r=&gt;{
      r.vid=f.v; r.asientos.forEach(a=&gt;{for(let k=1;k&lt;=cap(v);k++){if(!v.occ.includes(k)&amp;&amp;!v.pend.includes(k)){a.n=k;v.occ.push(k);break;}}});});

/* Calificación: estrellas + lo bueno + lo malo + observaciones (tabulable) */
const BUENO=[&#x27;Buen trato&#x27;,&#x27;Puntual&#x27;,&#x27;Vehículo limpio&#x27;,&#x27;Cómodo&#x27;,&#x27;Manejo seguro&#x27;,&#x27;Ayudó con el equipaje&#x27;];
const MALO=[&#x27;Cobro de más&#x27;,&#x27;Mal trato / grosero&#x27;,&#x27;Vehículo sucio&#x27;,&#x27;Música muy fuerte&#x27;,&#x27;Manejo brusco o peligroso&#x27;,&#x27;Impuntual&#x27;,&#x27;Paró demasiado&#x27;,&#x27;Asientos muy pequeños&#x27;,&#x27;Muy apretado / sin espacio para pasar&#x27;,&#x27;Sin ventana o sin dónde apoyarse&#x27;,&#x27;Llevó más pasajeros de la cuenta&#x27;,&#x27;Chofer con aliento a alcohol&#x27;,&#x27;Usó el celular manejando&#x27;,&#x27;No respetó mi asiento&#x27;,&#x27;Maltrató mi equipaje o encomienda&#x27;,&#x27;Otro&#x27;];

function calificar(id){rating={id,val:0,bueno:new Set(),malo:new Set()};const r=reservas.find(x=&gt;x.id===id);
  $(&#x27;#sheet&#x27;).innerHTML=`&lt;div class=&quot;sh-head&quot;&gt;&lt;div&gt;&lt;b&gt;Móvil ${V[r.vid].movil}&lt;/b&gt;&lt;div class=&quot;meta&quot;&gt;¿Cómo fue tu viaje con ${esc(V[r.vid].chofer)}?&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;field&quot;&gt;&lt;span class=&quot;lb&quot;&gt;¿Qué estuvo bien?&lt;/span&gt;${chips(BUENO,&#x27;b&#x27;)}&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;span class=&quot;lb&quot;&gt;¿Qué estuvo mal?&lt;/span&gt;${chips(MALO,&#x27;m&#x27;)}&lt;/div&gt;

    &lt;label class=&quot;field&quot; style=&quot;display:flex;gap:8px;align-items:flex-start&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;recl&quot;&gt; &lt;span&gt;&lt;b&gt;Quiero hacer un reclamo formal&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;hint&quot;&gt;Le llega al secretario de justicia del sindicato, que lo revisa y responde.&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;p class=&quot;hint&quot;&gt;Si el móvil no era como en la app (otros asientos), puedes reportarlo al sindicato.&lt;/p&gt;
    &lt;button class=&quot;btn pri confirm&quot; id=&quot;envR&quot; disabled onclick=&quot;enviarR()&quot;&gt;Enviar calificación&lt;/button&gt;
    &lt;button class=&quot;btn confirm&quot; onclick=&quot;cerrar();toast(&#x27;Reporte enviado al sindicato.&#x27;)&quot;&gt;Reportar diferencia con el móvil&lt;/button&gt;`;
  $(&#x27;#sheetBg&#x27;).classList.add(&#x27;open&#x27;);}

function volver(i){const c=st.choferes[i];c.e=c.prev||&#x27;fila&#x27;;c.mot=&#x27;&#x27;;reg(`Móvil ${c.m} terminó la delegación y vuelve a su puesto`);draw()}
function habilitar(i){const p=st.perdidos.splice(i,1)[0];const c=st.choferes.find(x=&gt;x.m==p.m);if(c)c.e=&#x27;fila&#x27;;reg(`Turno habilitado al móvil ${p.m}`);toast(&#x27;Turno habilitado&#x27;);draw()}
function cargo(i,k){const c=st.choferes[i];const mot=prompt(&#x27;Motivo de la multa&#x27;,&#x27;Falta a reunión&#x27;)||&#x27;Falta a reunión&#x27;;c.mul++;reg(`Multa de ${st.multa} Bs al móvil ${c.m}: ${mot}`);draw()}
function cobrarTodos(k){st.choferes.forEach(c=&gt;c[k]++);reg(k==&#x27;mes&#x27;?&#x27;Cuota mensual cargada a todos&#x27;:&#x27;Cuota anual cargada a todos&#x27;);toast(&#x27;Cuota cargada a todos los choferes&#x27;);draw()}
function draw2(){const t=document.getElementById(&#x27;rTipo&#x27;).value,o=st.choferes.map(c=&gt;`&lt;option value=&quot;${c.m}&quot;&gt;Móvil ${c.m} · ${c.n}&lt;/option&gt;`).join(&#x27;&#x27;);
document.getElementById(&#x27;rCampos&#x27;).innerHTML=t==&#x27;sancion&#x27;?`&lt;label&gt;Móvil &lt;select id=&quot;rM&quot;&gt;${o}&lt;/select&gt;&lt;/label&gt; &lt;label&gt;Sanción &lt;select id=&quot;rS&quot;&gt;&lt;option value=&quot;7&quot;&gt;Suspensión 7 días&lt;/option&gt;&lt;option value=&quot;15&quot;&gt;Suspensión 15 días&lt;/option&gt;&lt;option value=&quot;30&quot;&gt;Suspensión 30 días&lt;/option&gt;&lt;option value=&quot;0&quot;&gt;Retiro del sindicato&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;br&gt;&lt;input id=&quot;rTxt&quot; placeholder=&quot;Decisión en pocas palabras, ej. Falta grave según acta&quot; style=&quot;width:100%;margin-top:6px&quot;&gt;`
:`&lt;input id=&quot;rTxt&quot; placeholder=&quot;Ej. Aseo de la terminal, cada móvil una vez&quot; style=&quot;width:100%&quot;&gt;&lt;label style=&quot;display:block;margin-top:6px&quot;&gt;Plazo &lt;input id=&quot;rPl&quot; type=&quot;date&quot;&gt;&lt;/label&gt;&lt;p class=&quot;muted&quot;&gt;Quien no cumpla hasta el plazo queda suspendido automáticamente.&lt;/p&gt;`}
function nuevaRes(){const t=document.getElementById(&#x27;rTipo&#x27;).value,txt=document.getElementById(&#x27;rTxt&#x27;).value.trim();if(!txt){toast(&#x27;Escribe la decisión&#x27;);return}
const f=new Date().toLocaleDateString(&#x27;es-BO&#x27;,{day:&#x27;2-digit&#x27;,month:&#x27;2-digit&#x27;});
if(t==&#x27;sancion&#x27;){const m=+document.getElementById(&#x27;rM&#x27;).value,d=+document.getElementById(&#x27;rS&#x27;).value;const c=st.choferes.find(x=&gt;x.m==m);c.susp=d?`Suspendido ${d} días`:&#x27;Retirado&#x27;;
st.res.push({id:Date.now(),f,tipo:&#x27;sancion&#x27;,m,dias:d,txt});reg(`⚖️ Resolución: móvil ${m} ${c.susp.toLowerCase()} — ${txt}`)}
else{const pl=document.getElementById(&#x27;rPl&#x27;).value;st.res.push({id:Date.now(),f,tipo:&#x27;obligacion&#x27;,txt,plazo:pl?pl.split(&#x27;-&#x27;).reverse().slice(0,2).join(&#x27;/&#x27;):&#x27;sin fecha&#x27;,cumplio:[],venc:false});reg(`⚖️ Resolución para todos: ${txt}`)}
toast(&#x27;Resolución registrada: la app la hace cumplir&#x27;);draw()}
function cumplio(id,m){const r=st.res.find(x=&gt;x.id==id);r.cumplio.push(m);reg(`Móvil ${m} cumplió: ${r.txt}`);draw()}
function vencer(id){const r=st.res.find(x=&gt;x.id==id);r.venc=true;st.choferes.filter(c=&gt;!r.cumplio.includes(c.m)).forEach(c=&gt;{c.susp=&#x27;Suspendido por no cumplir resolución&#x27;;reg(`⚖️ Móvil ${c.m} suspendido automáticamente: no cumplió &quot;${r.txt}&quot;`)});toast(&#x27;Plazo vencido: los que no cumplieron quedaron suspendidos&#x27;);draw()}
function revisarRecl(m){const n=st.recl.filter(r=&gt;r.m==m&amp;&amp;r.e==&#x27;resuelto&#x27;&amp;&amp;r.r&amp;&amp;!r.r.startsWith(&#x27;Reclamo sin fundamento&#x27;)).length;const c=st.choferes.find(x=&gt;x.m==m);
if(c&amp;&amp;n&gt;=st.limRecl&amp;&amp;!c.susp){c.susp=&#x27;Suspendido 7 días por reclamos&#x27;;reg(`⚖️ Móvil ${m} suspendido automáticamente: ${n} reclamos con fundamento`);toast(`Móvil ${m} suspendido por ${n} reclamos`)}}
function resolver(i,t){const r=st.recl[i];const obs=prompt(&#x27;Detalle de la respuesta (opcional)&#x27;,&#x27;&#x27;)||&#x27;&#x27;;r.e=&#x27;resuelto&#x27;;r.r=t+(obs?&#x27;: &#x27;+obs:&#x27;&#x27;);reg(`Reclamo ${r.id} del móvil ${r.m}: ${r.r}`);if(r.app&amp;&amp;window.T21)T21.push(&#x27;resp&#x27;,{id:r.id,r:r.r});revisarRecl(r.m);toast(&#x27;Reclamo resuelto. Se avisa al pasajero.&#x27;);draw()}
function justif(i,ok){const x=st.emer[i];x.e=ok?&#x27;ok&#x27;:&#x27;falta&#x27;;reg(`Retiro por emergencia del móvil ${x.m} (${x.mot}): ${ok?&#x27;justificado, sin falta&#x27;:&#x27;no justificado, cuenta como falta&#x27;}`);draw()}
function desbloq(i){const c=st.clientes[i];c.b=false;c.f=0;reg(`Bloqueo quitado al cliente ${c.n}`);draw()}
function aprobar(i,ok){const p=st.pend.splice(i,1)[0];reg(`${p.t} ${p.n}: ${ok?&#x27;aprobado&#x27;:&#x27;rechazado&#x27;}`);toast(ok?&#x27;Aprobado&#x27;:&#x27;Rechazado&#x27;);draw()}
draw();
